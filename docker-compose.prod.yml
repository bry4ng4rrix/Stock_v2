version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: stock_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-stock_db}
      POSTGRES_USER: ${DB_USER:-stock}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stock_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stock_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: stock_backend
    environment:
      DJANGO_SETTINGS_MODULE: Stock.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost 127.0.0.1}
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.postgresql}
      DB_NAME: ${DB_NAME:-stock_db}
      DB_USER: ${DB_USER:-stock}
      DB_PASSWORD: ${DB_PASSWORD:-stock_password}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      # Ollama tourne sur l'hôte, hors du réseau compose : on l'atteint par la
      # passerelle docker0 (127.0.0.1 désignerait le conteneur lui-même).
      # Sert au rapprochement de fiches produit lors des transferts.
      OLLAMA_URL: ${OLLAMA_URL:-http://172.18.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      AI_PRODUCT_MATCHING_ENABLED: ${AI_PRODUCT_MATCHING_ENABLED:-True}
      AI_ASSISTANT_ENABLED: ${AI_ASSISTANT_ENABLED:-True}
      OLLAMA_ASSISTANT_MODEL: ${OLLAMA_ASSISTANT_MODEL:-qwen3:4b}
      OLLAMA_ASSISTANT_TIMEOUT: ${OLLAMA_ASSISTANT_TIMEOUT:-120}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "Stock.asgi:application"]
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: stock_frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:
  redis_data:
