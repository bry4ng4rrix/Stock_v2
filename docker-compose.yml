version: '3.8'

services:

  db:
    image: postgres:16-alpine
    container_name: stock_postgres
    environment:
      POSTGRES_DB: stock_db
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: "skdvrlNl1tUay9vSbW3y1GuXNTIapmn9"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=2GB
      - -c
      - max_connections=60
    mem_limit: 1.5g
    cpus: 1.5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stock_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: stock_backend
    environment:
      DJANGO_SETTINGS_MODULE: Stock.settings
      DEBUG: "True"
      ALLOWED_HOSTS: "157.173.103.147 localhost 127.0.0.1 0.0.0.0"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: stock_db
      DB_USER: stock
      DB_PASSWORD: "skdvrlNl1tUay9vSbW3y1GuXNTIapmn9"
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: "http://157.173.103.147:3000 http://localhost:3000"
      CSRF_TRUSTED_ORIGINS: "http://157.173.103.147 http://157.173.103.147:3000 http://157.173.103.147:8000 http://localhost"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_CACHE_URL: "redis://redis:6379/1"
      # Ollama tourne sur l'hôte, hors du réseau compose : on l'atteint par la
      # passerelle docker0 (127.0.0.1 désignerait le conteneur lui-même).
      # Sert au rapprochement de fiches produit lors des transferts.
      OLLAMA_URL: "${OLLAMA_URL:-http://172.18.0.1:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      AI_PRODUCT_MATCHING_ENABLED: "${AI_PRODUCT_MATCHING_ENABLED:-True}"
      AI_ASSISTANT_ENABLED: "${AI_ASSISTANT_ENABLED:-True}"
      OLLAMA_ASSISTANT_MODEL: "${OLLAMA_ASSISTANT_MODEL:-qwen3:4b}"
      OLLAMA_ASSISTANT_TIMEOUT: "${OLLAMA_ASSISTANT_TIMEOUT:-120}"
      OLLAMA_ASSISTANT_NUM_CTX: "${OLLAMA_ASSISTANT_NUM_CTX:-8192}"
    command: daphne -b 0.0.0.0 -p 8000 Stock.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: stock_frontend
    working_dir: /app/frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://157.173.103.147:8000/api"
      NEXT_PUBLIC_DJANGO_API_URL: "http://157.173.103.147:8000/api"
    command: sh -c "npm install && npm run build && npm start"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:

networks:
  default:
    # Épinglé pour que la passerelle reste 172.18.0.1 (utilisée par
    # OLLAMA_URL) même si ce réseau est un jour recréé — sans ça, Docker
    # réattribue une passerelle depuis son pool d'adresses par défaut.
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
