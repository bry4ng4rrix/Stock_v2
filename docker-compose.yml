version: '3.8'

services:

  db:
    image: postgres:16-alpine
    container_name: stock_postgres
    environment:
      POSTGRES_DB: stock_db
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: "skdvrlNl1tUay9vSbW3y1GuXNTIapmn9"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: stock_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: stock_backend
    environment:
      DJANGO_SETTINGS_MODULE: Stock.settings
      DEBUG: "True"
      ALLOWED_HOSTS: "157.173.103.147 localhost 127.0.0.1 0.0.0.0"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: stock_db
      DB_USER: stock
      DB_PASSWORD: "skdvrlNl1tUay9vSbW3y1GuXNTIapmn9"
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: "http://157.173.103.147:3000 http://localhost:3000"
      CSRF_TRUSTED_ORIGINS: "http://157.173.103.147 http://157.173.103.147:3000 http://157.173.103.147:8000 http://localhost"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_CACHE_URL: "redis://redis:6379/1"
    command: daphne -b 0.0.0.0 -p 8000 Stock.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: stock_frontend
    working_dir: /app/frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://157.173.103.147:8000/api"
      NEXT_PUBLIC_DJANGO_API_URL: "http://157.173.103.147:8000/api"
    command: sh -c "npm install && npm run build && npm start"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
